<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Momoyumemi – anime NFT arcade runner" />
  <meta name="theme-color" content="#1a0828" />
  <title>MOMOYUMEMI · 桃夢見</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<!-- ── Game canvas ──────────────────────────────────────────────────────────── -->
<canvas id="c"></canvas>

<!-- ── In-game HUD ─────────────────────────────────────────────────────────── -->
<div id="ui" style="display:none;">
  <div id="fov"></div>

  <div id="topbar">
    <div id="left">
      <div id="pname"></div>
      <div id="sv">0</div>
      <div id="shield-row">
        <div id="shield-icon">🍑</div>
        <div id="peach-prog">0 / 3</div>
      </div>
    </div>
    <div id="right">
      <div id="dlabel">桃夢見</div>
      <div id="surv-timer">0:00</div>
    </div>
    <!-- mute sits as the rightmost flex child, theme beside it, no overlap -->
    <div id="hud-end">
      <div id="thname"></div>
      <button id="mute-btn" aria-label="Toggle mute">🔊</button>
    </div>
  </div>

  <div id="stimer"></div>
  <div id="gaplabel"></div>
  <div id="bot">
    <div id="ctxt"></div>
    <div id="hint">tap · space to float</div>
  </div>
</div>

<!-- ── Login screen ─────────────────────────────────────────────────────────── -->
<div id="login-wrap">
  <div class="login-header">
    <div class="login-kanji">桃 · 夢 · 見</div>
    <div class="ltitle">MOMOYUMEMI</div>
    <div class="lsub">the one who sees peach-colored dreams</div>
  </div>
  <div class="lcard">
    <div class="slabel">✦ your name</div>
    <input class="ninp" id="ni" placeholder="enter your name…" maxlength="16" autocomplete="off" />
    <div id="savlbl"></div>
    <div class="divdr"></div>
    <div class="slabel">✦ choose character</div>
    <div class="cgrid" id="cgrid"></div>
    <div class="divdr"></div>
    <div class="slabel">✦ choose theme</div>
    <div class="tgrid" id="tgrid"></div>
    <button class="pbtn" id="pb" disabled>[ enter the dream ]</button>
    <div class="lblink" id="lbb">view leaderboard →</div>
  </div>
</div>

<!-- ── Game-over screen ─────────────────────────────────────────────────────── -->
<div id="os">
  <!-- small theme tag top-right -->
  <div id="os-theme-tag" class="os-theme-tag"></div>

  <!-- player name as primary heading -->
  <div id="os-player" class="os-player"></div>
  <div class="os-divider"></div>

  <div class="osc" id="os-sc"></div>
  <div class="obest" id="os-b"></div>
  <div class="os-time" id="os-time"></div>

  <div class="os-btns">
    <button class="obtn" id="rb">[ dream again ]</button>
    <button class="obtn sec" id="lbb2">[ leaderboard ]</button>
  </div>
  <button class="obtn sec" id="swb">[ switch player ]</button>
</div>

<!-- ── Leaderboard screen ───────────────────────────────────────────────────── -->
<div id="ls">
  <div class="lt">LEADERBOARD</div>
  <div class="ls2">最高得点 · high scores</div>
  <div id="lbt"></div>
  <button class="obtn sec" id="backb">[ back ]</button>
</div>

<!--
  Script load order:
    1. images.js      – IMG_DATA (base64 NFTs, must be first)
    2. audio.js       – Web Audio SFX + BGM
    3. supabase.js    – community leaderboard REST calls
    4. leaderboard.js – device-local score storage
    5. game.js        – canvas, physics, backgrounds, game loop
    6. ui.js          – screens, pickers, event wiring, init
-->
<script src="./js/images.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/leaderboard.js"></script>
<script src="./js/game.js"></script>
<script src="./js/ui.js"></script>
</body>
</html>
