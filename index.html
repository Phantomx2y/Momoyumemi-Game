<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Momoyumemi – anime NFT arcade runner" />
  <title>MOMOYUMEMI · 桃夢見</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<canvas id="c"></canvas>
<div id="ui" style="display:none;">
  <div id="fov"></div>
  <div id="topbar">
    <div id="left">
      <div id="pname"></div>
      <div id="sv">0</div>
      <div id="shield-row"><div id="shield-icon">🍑</div><div id="peach-prog">0 / 3</div></div>
    </div>
    <div id="right"><div id="dlabel">桃夢見</div><div id="thname"></div><div id="surv-timer" style="font-size:11px;letter-spacing:2px;color:#f9d8e0;margin-top:4px;font-weight:700;font-family:'Courier New',monospace;">0:00</div></div>
  </div>
  <div id="stimer"></div>
  <div id="gaplabel"></div>
  <div id="bot"><div id="ctxt"></div><div id="hint">tap · space to float</div></div>
</div>
<div id="login-wrap">
  <div style="text-align:center;margin-bottom:8px;">
    <div style="font-size:10px;letter-spacing:6px;color:#a050a0;margin-bottom:5px;">桃 · 夢 · 見</div>
    <div class="ltitle">MOMOYUMEMI</div>
    <div class="lsub">the one who sees peach-colored dreams</div>
  </div>
  <div class="lcard">
    <div class="slabel">✦ your name</div>
    <input class="ninp" id="ni" placeholder="enter your name..." maxlength="16" autocomplete="off"/>
    <div id="savlbl"></div>
    <div class="divdr"></div>
    <div class="slabel">✦ choose character</div>
    <div class="cgrid" id="cgrid"></div>
    <div class="divdr"></div>
    <div class="slabel">✦ choose theme</div>
    <div class="tgrid" id="tgrid"></div>
    <button class="pbtn" id="pb">[ enter the dream ]</button>
    <div class="lblink" id="lbb">view leaderboard →</div>
  </div>
</div>
<div id="os">
  <div class="ok" id="os-k">夢の終わり</div>
  <div class="ot" id="os-t">MOMO</div>
  <div class="os2" id="os-s">she woke up</div>
  <div class="osc" id="os-sc"></div>
  <div class="obest" id="os-b"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
    <button class="obtn" id="rb">[ dream again ]</button>
    <button class="obtn sec" id="lbb2">[ leaderboard ]</button>
  </div>
  <button class="obtn sec" id="swb" style="margin-top:6px;">[ switch player ]</button>
</div>
<div id="ls">
  <div class="lt">LEADERBOARD</div>
  <div class="ls2">最高得点 · high scores</div>
  <div id="lbt"></div>
  <button class="obtn sec" id="backb">[ back ]</button>
</div>

  <!--
    Script load order matters:
      1. images.js   – IMG_DATA array (base64 NFT images)
      2. audio.js    – audio stubs
      3. supabase.js – community leaderboard (Supabase REST)
      4. leaderboard.js – local device score storage
      5. game.js     – canvas, state, BG, physics, game loop
      6. ui.js       – screens, pickers, event wiring, init
  -->
  <script src="./js/images.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/leaderboard.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/ui.js"></script>
</body>
</html>
